</main><script>
const $=s=>document.querySelector(s);let mode='a',step=1,chosen='cx-api',showEvidence=false;
const descriptions={a:['지금 보던 지도에서 연결을 따라가기','FE를 누르면 점선과 접힌 API 후보가 보입니다. 선이나 후보를 누르면 BE가 같은 지도에 펼쳐집니다.','기존 탐색과 자연스럽게 연결','전체 자원과의 위치 관계를 유지합니다. 사용자가 요청한 흐름에 가장 가깝습니다.','후보가 많을 때','선이 많아질 수 있어 선택한 FE의 관계만 우선 표시합니다.'],b:['근거를 보고 필요한 API만 펼치기','FE를 선택하면 오른쪽에 API 후보가 모입니다. 후보를 누르면 해당 BE가 지도에 펼쳐집니다.','여러 후보를 비교하기 좋음','Origin·대상·설정 상태를 한곳에서 확인할 수 있습니다.','지도에 쓸 수 있는 공간','패널이 가로 공간을 차지합니다. 작은 화면에서는 아래로 내려갑니다.'],c:['서비스 단위로 좁혀 보기','FE에서 관계 탐색을 시작하면 주변 자원을 접고 FE와 API·Lambda 경로에 집중합니다.','흐름을 설명하기 좋음','FE 호스팅과 API 호출을 구분하며, 향후 URL 시뮬레이터로 확장하기 쉽습니다.','전체 구성과의 맥락','별도 탐색 화면처럼 느껴집니다. 전체 지도로 돌아가는 동작이 필요합니다.']};
function node(id,x,y,title,type,icon,color='',extra='',action=''){return `<g class="node ${extra}" transform="translate(${x} ${y})" ${action?`role="button" tabindex="0" aria-label="${title} ${action==='select'?'선택':'펼치기'}" data-action="${action}"`:''}><rect width="192" height="68" rx="9"/><text class="icon ${color}" x="15" y="32">${icon}</text><text x="44" y="27">${title}</text><text class="meta" x="44" y="49">${type}</text></g>`}
function line(x1,y1,x2,y2,inferred=false,label='',action=''){let mid=(x1+x2)/2;const path=`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`;return `<g ${action?`class="edge-button" role="button" tabindex="0" aria-label="${label} 연결 펼치기" data-action="${action}"`:''}><path class="edge ${inferred?'inferred':''}" d="${path}" marker-end="url(#arrow)"/>${action?`<path class="edge-hit" d="${path}"/>`:''}${label?`<g class="edge-label" transform="translate(${mid-48} ${(y1+y2)/2-30})"><rect width="96" height="25" rx="5"/><text x="48" y="17" text-anchor="middle">${label}</text></g>`:''}</g>`}
function detail(){return `<div class="info"><b>CORS 허용 근거</b><dl><dt>허용 Origin</dt><dd>https://cx.example.com</dd><dt>연결 후보</dt><dd>${chosen} · HTTP API</dd><dt>일치한 FE 호스팅</dt><dd>CX FE · CloudFront 대체 도메인</dd><dt>설정 상태</dt><dd>현재 설정 · 배포 여부 미확인</dd></dl><p class="limit">호출 가능성을 나타냅니다. 실제 호출이나 인증 성공을 확인한 결과는 아닙니다.</p></div>`}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.mode===mode));b.tabIndex=b.dataset.mode===mode?0:-1});$('#preview').setAttribute('aria-labelledby','tab-'+mode);document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===step)));
$('#workbar').innerHTML=mode==='c'&&step>0?`<div class="crumb"><button data-action="back">전체 지도</button><span>/</span><strong>CX FE 관계 탐색</strong></div><button class="plain" data-action="back">전체 지도로 돌아가기</button>`:`<strong>${step?'CX FE 선택됨':'전체 토폴로지'}</strong><span>${step?'기존 필터를 유지하고 관련 자원만 펼칩니다.':'CX FE를 눌러 연결 후보를 확인하세요.'}</span>${step?'<button class="plain" data-action="back">선택 해제</button>':''}`;
$('#route').innerHTML=mode==='c'&&step>0?'<div class="route-strip"><b>FE 호스팅</b><span>CloudFront · S3</span><span>／</span><b>API 연결 후보</b><span>CORS 허용 근거</span><span>／</span><b>BE</b><span>API Gateway · Lambda</span></div>':'';
const side=mode==='b'&&step>0;const detailSide=mode==='a'&&showEvidence&&step>0;$('#sidebar').hidden=!(side||detailSide);
if(side)$('#sidebar').innerHTML=`<h2>API 연결 후보 <span class="badge">2개</span></h2><p>CX FE 주소를 허용하는 API입니다.</p>${['cx-api','cx-report-api'].map((name,i)=>`<button class="candidate ${chosen===name&&step===2?'active':''}" data-action="${i?'report':'expand'}"><b>${name}</b><span>CORS 허용 · HTTP API</span><span>${chosen===name&&step===2?'지도에 펼쳐짐':'클릭하여 BE 펼치기'}</span></button>`).join('')}${step===2?detail():''}`;else if(detailSide)$('#sidebar').innerHTML='<h2>연결 근거</h2>'+detail()+'<button class="plain" data-action="detail">근거 닫기</button>';
const narrow=side||detailSide;const W=narrow?820:1120;const focused=mode==='c'&&step>0;const feX=focused?90:65;const feY=focused?160:175;const apiX=narrow?360:525;const lambdaX=narrow?610:845;const apiY=175;
let svg=`<svg viewBox="0 0 ${W} 500" role="group" aria-label="${mode.toUpperCase()}안 FE BE 관계 지도"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="var(--muted)"/></marker></defs>`;
if(!focused){svg+=`<g class="faint">${node('wiki',35,45,'Wiki FE','CloudFront','◎')}${node('stt',W-230,55,'STT worker','EC2','▣','compute')}${node('db',W-245,380,'analytics-db','RDS','▤')}</g>`;}
svg+=`<rect class="group" x="${feX-20}" y="${feY-40}" width="232" height="245" rx="14"/><text class="maplabel" x="${feX-5}" y="${feY-17}">FE 앱 · cx.example.com</text>`;
svg+=`<path class="edge" d="M${feX+96},${feY+68} V${feY+125}" marker-end="url(#arrow)"/><text class="maplabel" x="${feX+108}" y="${feY+103}">오리진</text>`;
svg+=node('fe',feX,feY,'CX FE','CloudFront · FE 호스팅','◎','',step?'selected':'','select');svg+=node('s3',feX,feY+125,'cx-web-assets','S3 · 정적 파일','▱','storage');
if(step>0){svg+=line(feX+192,feY+34,apiX,apiY+34,true,'CORS 허용','expand-current');svg+=node('api',apiX,apiY,chosen,step===2?'API Gateway · HTTP API':'API 후보 · 클릭하여 펼치기','◇','',step===2?'':'candidate-node','expand-current');if(step===2){svg+=line(apiX+192,apiY+34,lambdaX,apiY+34,false,narrow?'':'Lambda 통합');svg+=node('lambda',lambdaX,apiY,chosen==='cx-api'?'cx-api-handler':'cx-report-handler','Lambda · 설정상 통합','λ','compute');if(mode==='c')svg+=`<text class="maplabel" x="${apiX}" y="285">이 선은 API 설정의 Lambda 통합입니다.</text>`;}else if(mode==='a')svg+=`<text class="maplabel" x="${apiX}" y="275">점선 또는 API 후보를 눌러 BE를 펼치세요.</text>`;if(mode==='a'&&!narrow)svg+=`<g role="button" tabindex="0" data-action="${chosen==='cx-api'?'report':'expand'}" aria-label="다른 API 후보 펼치기">${line(feX+192,feY+48,apiX,355,true)}${node('report',apiX,321,chosen==='cx-api'?'cx-report-api':'cx-api','추가 API 후보','◇','','candidate-node')}</g>`;}
if(step===0)svg+=`<text class="maplabel" x="${W/2}" y="470" text-anchor="middle">CX FE를 선택하면 허용 관계 후보가 나타납니다.</text>`;svg+='</svg>';$('#map').innerHTML=svg;
$('#evidence').innerHTML=step>0&&mode!=='b'?`<div class="evidencebar"><strong>${step===2?'BE 펼침':'API 후보 발견'}</strong><p>cx.example.com과 API의 허용 Origin이 일치합니다.<br>FE 앱의 호출 후보이며 S3가 API를 호출하는 구조는 아닙니다.</p><button class="plain" data-action="detail" style="margin-left:auto">${showEvidence?'근거 닫기':'연결 근거 보기'}</button></div>`:'';
if(mode==='c'&&showEvidence&&step>0)$('#evidence').innerHTML+='<div style="padding:0 20px 12px;background:var(--panel)">'+detail()+'</div>';
const d=descriptions[mode];$('#summary').innerHTML=[0,2,4].map(i=>`<div><h3>${d[i]}</h3><p>${d[i+1]}</p></div>`).join('');}
function act(action){if(action==='select'){step=1;showEvidence=false;chosen='cx-api'}if(action==='expand'||action==='report'||action==='expand-current'){step=2;if(action!=='expand-current')chosen=action==='report'?'cx-report-api':'cx-api'}if(action==='back'){step=0;showEvidence=false}if(action==='detail')showEvidence=!showEvidence;render();$('#status').textContent=step===2?chosen+'와 Lambda를 예시 지도에 펼쳤습니다.':step===1?'CX FE의 API 허용 후보를 표시했습니다.':'전체 예시 지도로 돌아왔습니다.'}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a)return act(a.dataset.action);const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;step=1;showEvidence=false;chosen='cx-api';$('#status').textContent='';render();return}const st=e.target.closest('[data-step]');if(st){step=+st.dataset.step;showEvidence=false;render()}});
document.addEventListener('keydown',e=>{const a=e.target.closest('[data-action]');if(a&&a.tagName.toLowerCase()==='g'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act(a.dataset.action)}const t=e.target.closest('[data-mode]');if(t&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const modes=['a','b','c'];mode=modes[(modes.indexOf(mode)+(e.key==='ArrowRight'?1:2))%3];step=1;showEvidence=false;render();$('#tab-'+mode).focus()}});
$('#theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('#theme').textContent=light?'다크 보기':'라이트 보기'};render();
</script></body></html>
