<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app icon: the favicon's orrery mark on the 824px icon grid. Render: rsvg-convert -w 1024 -h 1024 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#17233D"/>
      <stop offset="1" stop-color="#070C17"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#F5D58A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F5D58A" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
  <g transform="translate(512 512)" fill="none">
    <circle r="300" stroke="#5F6E8C" stroke-width="12" stroke-opacity="0.85"/>
    <circle r="171" stroke="#5F6E8C" stroke-width="12" stroke-opacity="0.85"/>
    <circle r="150" fill="url(#glow)"/>
    <circle r="63" fill="#F5D58A"/>
    <circle cx="300" cy="0" r="51" fill="#6CA2FD"/>
    <circle cx="-107" cy="-134" r="46" fill="#E09A2E"/>
    <circle cx="71" cy="157" r="40" fill="#E55CAF"/>
  </g>
</svg>
